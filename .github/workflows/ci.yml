name: CI

# The pre-commit hook tells you "the CI backend job runs them on every PR".
# This workflow is what makes that true.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # backend/ and frontend/ are independent npm projects with their own
  # package.json and their own node_modules, so they get their own jobs and
  # run in parallel. Neither imports the other's source.
  backend:
    name: backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint
        # The local script passes --fix; in CI we only want to be told, never
        # to have files silently rewritten.
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build (also the typecheck gate - there is no separate tsc script)
        run: npm run build

      - name: Committed OpenAPI spec is up to date
        # api:emit, not api:spec: Build has just run `nest build` with the
        # swagger plugin active, and there is no reason to compile twice.
        # A committed generated artifact rots silently unless something looks,
        # and a stale spec means the frontend types describe an API that no
        # longer exists. Regenerate with `npm run api:sync` from the repo root.
        run: |
          npm run api:emit
          git diff --exit-code --stat openapi.json

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

  frontend:
    name: frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Committed API types are up to date
        # The other half of the drift gate. The backend job proves the spec
        # still matches the code; this proves the types still match the spec,
        # and the two together are what make the committed artifacts
        # trustworthy. It runs here rather than in the backend job because
        # openapi-typescript only reads the committed JSON - no
        # backend/node_modules required.
        run: |
          npm run api:types
          git diff --exit-code --stat src/types/api.d.ts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (also the typecheck gate - next build type-checks the app)
        # BACKEND_URL is not needed to build: page.tsx falls back to
        # http://localhost:3000 and the fetch only runs at request time.
        run: npm run build

  # Repo-wide checks that belong to neither app.
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs history to see the range of commits being merged.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Commit messages follow Conventional Commits
        # On a PR, check every commit in the branch. The commit-msg hook does
        # this locally, but hooks can be skipped with --no-verify.
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      # A repo-wide Prettier gate is deliberately NOT enabled yet: 55 existing
      # files predate the Prettier config and would fail immediately. Run
      # `npx prettier --write .` once, commit that, then uncomment this:
      #
      # - name: Formatting matches Prettier
      #   run: npx prettier --check .
