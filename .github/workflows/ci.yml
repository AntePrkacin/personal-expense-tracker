name: CI

# The pre-commit hook tells you "the CI backend job runs them on every PR".
# This workflow is what makes that true.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # backend/ and frontend/ are independent npm projects with their own
  # package.json and their own node_modules, so they get their own jobs and
  # run in parallel. Neither imports the other's source.
  backend:
    name: backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Lint
        # The local script passes --fix; in CI we only want to be told, never
        # to have files silently rewritten.
        run: npx eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build (also the typecheck gate - there is no separate tsc script)
        run: npm run build

      - name: Committed OpenAPI spec is up to date
        # api:emit, not api:spec: Build has just run `nest build` with the
        # swagger plugin active, and there is no reason to compile twice.
        # A committed generated artifact rots silently unless something looks,
        # and a stale spec means the frontend types describe an API that no
        # longer exists. Regenerate with `npm run api:sync` from the repo root.
        run: |
          npm run api:emit
          git diff --exit-code --stat openapi.json

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

  frontend:
    name: frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # src/app/fonts.ts pulls Plus Jakarta Sans and Inter from Google Fonts at
      # build time, so `npm run build` reaches the network. Restoring Next's
      # cache lets repeat runs reuse the downloaded files instead of refetching,
      # which removes the most likely source of an unrelated red build.
      #
      # Two honest limits: a first run on a new branch still fetches (the
      # restore-keys fallback only helps once a lockfile-matching run has been
      # cached), and `build-storybook` has its own fetch that this does not
      # cover. Making both hermetic would mean moving to next/font/local with
      # committed woff2 files.
      #
      # `path` is repo-relative: defaults.run.working-directory applies to `run`
      # steps only, never to an action's inputs.
      - name: Restore Next.js cache
        uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Committed API types are up to date
        # The other half of the drift gate. The backend job proves the spec
        # still matches the code; this proves the types still match the spec,
        # and the two together are what make the committed artifacts
        # trustworthy. It runs here rather than in the backend job because
        # openapi-typescript only reads the committed JSON - no
        # backend/node_modules required.
        run: |
          npm run api:types
          git diff --exit-code --stat src/types/api.d.ts

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build (also the typecheck gate - next build type-checks the app)
        # BACKEND_URL is not needed to build: page.tsx falls back to
        # http://localhost:3000 and the fetch only runs at request time.
        run: npm run build

      - name: Build Storybook
        # `next build` already type-checks .storybook/* and the story files,
        # because tsconfig.json includes them. This step exists to catch what
        # typechecking cannot: a broken framework option, a bad addon, or a CSS
        # import that no longer resolves - all of which otherwise stay silent
        # until someone opens Storybook locally.
        #
        # This fetches Google Fonts too, and the cache above does not cover it,
        # so a fonts.googleapis.com blip can fail the job. next/font retries
        # internally; a re-run is the fix, not a code change.
        run: npm run build-storybook

  # Repo-wide checks that belong to neither app.
  conventions:
    name: conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs history to see the range of commits being merged.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Commit messages follow Conventional Commits
        # On a PR, check every commit in the branch. The commit-msg hook does
        # this locally, but hooks can be skipped with --no-verify.
        if: github.event_name == 'pull_request'
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Documentation facts are single-sourced
        # Every assertion in this script corresponds to a fact that was once
        # stated in two places and where one copy silently went wrong (the Node
        # major, the engines floor, the backend's environment variables), or to
        # a break nothing else could see (an unclosed code fence, a scoped
        # CLAUDE.md with no "Not built here"). It is POSIX sh, git and grep
        # only, so it needs nothing installed.
        run: npm run docs:check

      # A repo-wide Prettier gate is deliberately NOT enabled yet: existing
      # files predate the Prettier config and would fail immediately. Run
      # `npx prettier --list-different .` for the current set. To enable it, run
      # `npx prettier --write .` once, commit that, then uncomment this:
      #
      # - name: Formatting matches Prettier
      #   run: npx prettier --check .
