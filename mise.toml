[tools]
# Keep this major in sync with .nvmrc, which CI reads. mise does not read .nvmrc (its
# idiomatic_version_file_enable_tools setting is empty by default), so the two are
# independent and `latest` here would silently drift past CI the day a new major ships.
node = "26"
"npm:npm-check-updates" = "latest"

# Audit
#
# `npm audit` exits 1 whenever it finds anything at all, so a plain `run` array aborts on
# the first package with findings and silently never reaches the rest. Keep the `|| true`:
# this task is a report, not a gate, so it visits every package and always exits 0.
# A pass/fail gate belongs in CI, where `npm audit --omit=dev --audit-level=high` is the
# check that matters. See docs/2026-07-30-audit.md for why the raw totals mislead.
#
# Those two flags correct two different distortions, and belong in a gate, never here:
#
#   --omit=dev          Answers "can an attacker reach this?". Dev dependencies are not
#                       shipped; jest/eslint/@nestjs/cli run only against inputs we
#                       control. As of 2026-07-30 this takes backend from 25 high to 0,
#                       and frontend from 29 to 3, so the default number would block
#                       merges over a DoS in a glob parser reading our own test paths.
#   --audit-level=high  Sets where the gate trips. It changes only the exit code, not the
#                       output (verified: --audit-level=critical still prints the high
#                       findings but exits 0). Without it the gate trips on low/info,
#                       which in a Next.js tree is a constant trickle we cannot act on.
#
# Caveat before adding this to ci.yml: it still exits 1 on frontend today, because the
# next -> postcss/sharp findings have no upstream fix at any version. Land the `overrides`
# from docs/2026-07-30-audit.md first, or scope the gate to backend only.
[tasks."audit"]
description = "Audit across the repository sequentially"
raw = true # Forces direct terminal output for the whole sequence
run = '''
for dir in . backend frontend; do
  printf '\n===== npm audit: %s =====\n' "$dir"
  (cd "$dir" && npm audit) || true
done

printf '\nThe totals above count dev-only findings. Production dependencies only:\n'
for dir in . backend frontend; do
  printf '  %-9s ' "$dir"
  if (cd "$dir" && npm audit --omit=dev --audit-level=high >/dev/null 2>&1); then
    echo "clean"
  else
    echo "findings -> cd $dir && npm audit --omit=dev"
  fi
done
'''

# Safe upgrade, install and update
[tasks."check-for-updates"]
description = "Check all updates across the repository sequentially"
raw = true # Forces direct terminal output for the whole sequence
run = [
  "ncu",
  "cd backend && ncu",
  "cd frontend && ncu"
]

[tasks."update:repo"]
description = "Safely max out root repository tooling minor/patch versions"
run = [
  "ncu -u --target minor",
  "npm install",
  "npm update"
]

[tasks."update:backend"]
description = "Safely max out backend minor/patch versions"
dir = "backend"
wait_for = ["update:repo"]
run = [
  "ncu -u --target minor",
  "npm install",
  "npm update"
]

[tasks."update:frontend"]
description = "Safely max out frontend minor/patch versions"
dir = "frontend"
wait_for = ["update:repo", "update:backend"]
run = [
  "ncu -u --target minor",
  "npm install",
  "npm update"
]

# `depends` is what actually schedules the subtasks; `wait_for` on each subtask above is
# what orders them. Using only `wait_for` here made this task a silent no-op: `wait_for`
# waits for a task solely if something else already scheduled it, and nothing did.
[tasks."update"]
description = "Max out all minor versions across the entire repository sequentially"
depends = ["update:repo", "update:backend", "update:frontend"]

[tasks."install:repo"]
description = "Install root tooling and activate git hooks"
run = "npm install"

# install:repo must complete first and must not be reordered: its `prepare` script is what
# sets core.hooksPath, and if it fails the chain stops rather than leaving hooks absent.
[tasks."install:backend"]
description = "Install backend dependencies and setup env"
dir = "backend"
wait_for = ["install:repo"]
run = [
  "npm install",
  "cp -n .env.example .env" # -n prevents overwriting your existing .env
]

[tasks."install:frontend"]
description = "Install frontend dependencies and setup env"
dir = "frontend"
wait_for = ["install:repo", "install:backend"]
run = [
  "npm install",
  "cp -n .env.example .env.local" # -n prevents overwriting your existing .env.local
]

[tasks.install]
description = "Install everything and setup the repository"
depends = ["install:repo", "install:backend", "install:frontend"]

# Drizzle's own agent skills live inside drizzle-kit and are committed to this
# repo, so a fresh clone already has them and this is NOT part of install. It is
# a refresh: run it after bumping drizzle-kit, then commit the diff, the same way
# `db:generate` output is committed. Runs from the repo root, using the
# drizzle-kit in backend/node_modules, because the skills belong to the repo
# rather than to the backend app.
[tasks."skills"]
description = "Refresh Drizzle's agent skills from the installed drizzle-kit"
run = "npm run skills"

# Generating migrations is the one database chore worth a shortcut. Applying them is not
# a task at all: the app does that itself, at boot for the central database and on first
# open for each user's, which is the only thing that works with a database per user.
[tasks."db:generate"]
description = "Generate Drizzle migrations for both database scopes"
dir = "backend"
run = "npm run db:generate"

# The other committed generated artifact, and the other thing CI fails on when it
# goes stale. Both halves in one task because their order matters: the frontend
# types are read out of the spec the backend half writes.
[tasks."api:sync"]
description = "Regenerate the OpenAPI spec and the frontend types from it"
run = "npm run api:sync"

[tasks."dev:backend"]
description = "Start backend development server"
dir = "backend"
run = "npm run start:dev"

[tasks."dev:frontend"]
description = "Start frontend development server"
dir = "frontend"
run = "npm run dev"

[tasks.dev]
description = "Start both backend and frontend servers together"
depends = ["dev:backend", "dev:frontend"]

# Fire the workflow_dispatch-only deploy, stream it live (instead of clicking
# through the Actions tab), and open the run page at the end. `raw = true` hands
# the terminal to `gh run watch` so its live-redrawing status renders. Always
# deploys main; the workflow refuses any other ref.
[tasks."deploy-backend"]
description = "Dispatch the Fly deploy workflow and stream it to completion"
raw = true
run = "scripts/deploy-backend.sh"

# Two tasks rather than one with a flag, because the two targets are not
# equally forgiving: a mistaken local run writes a gitignored SQLite file, a
# mistaken cloud run creates a real database and thousands of rows in the
# shared Turso organization. Reaching the cloud has to be typed out.
[tasks."seed"]
description = "Seed the showcase user into the local SQLite files"
dir = "backend"
run = "npx ts-node src/scripts/seed-showcase.ts --local"

[tasks."seed:cloud"]
description = "Seed the showcase user into Turso Cloud (needs backend/.env)"
dir = "backend"
run = "npx ts-node src/scripts/seed-showcase.ts --cloud"

# Reports rather than asserts, and touches no database at all - the generator is
# pure, so this is just arithmetic over its output. Run it with --trials=200
# after changing the model: one account cannot tell you whether a category goes
# over its cap 5% of the time or 60% of the time, and that difference is the
# whole question.
[tasks."seed:check"]
description = "Measure the showcase spending model without seeding anything"
dir = "backend"
run = "npx ts-node src/scripts/check-showcase-fixture.ts"

# Regenerates a committed artifact
# (backend/src/scripts/showcase/fixture.data.json - named .data.json rather
# than .json because a same-named fixture.json next to fixture.ts makes Node
# resolve a bare `./fixture` import to the JSON file instead of the module),
# so it belongs in its own commit - never bundled with an unrelated change,
# and never hand-edited. Run `seed:check` against the result before
# committing: this command reproduces the model faithfully, it has no opinion
# on whether the numbers it produced are the ones you want.
[tasks."seed:fixture"]
description = "Regenerate the committed showcase fixture.data.json"
dir = "backend"
run = "npx ts-node src/scripts/build-showcase-fixture.ts"

# Mails every showcase participant their own 24-hour login link into the shared
# demo account. Two tasks for the same reason `seed` has two, sharpened: a
# mistaken local run writes rows into a gitignored SQLite file, a mistaken cloud
# run emails real people. So reaching production is typed out - and on top of
# that the cloud task still does nothing until `-- --send` is added, because the
# dry run is the default and is what replaces a draft-review step.
#
#   mise run showcase:invite                     read the plan and the rendered mail
#   mise run showcase:invite:cloud               same, against the real database
#   mise run showcase:invite:cloud -- --send     mint and mail
#
# `raw = true` because the send pauses for a typed confirmation, and mise's
# captured output would swallow the prompt.
[tasks."showcase:invite"]
description = "Dry-run the showcase invite mails against the local database"
dir = "backend"
raw = true
run = "npx ts-node src/scripts/invite-showcase.ts --local"

[tasks."showcase:invite:cloud"]
description = "Mint and mail showcase login links (needs -- --send to do anything)"
dir = "backend"
raw = true
run = "npx ts-node src/scripts/invite-showcase.ts --cloud"

# Reset is the inverse of seed, and split into two tasks for the same reason: a
# mistaken local run deletes a gitignored SQLite file, a mistaken cloud run
# destroys every account in Turso and the volume under the deployed app. So
# reaching the cloud has to be typed out here, and the script then asks for the
# project name on top of that.
#
# `raw = true` on both because the cloud reset reads a confirmation from the
# terminal, and mise's captured output would swallow the prompt.
#
# The cloud reset needs TURSO_API_TOKEN, an operator token the app deliberately
# does not have: TURSO_ORG_TOKEN is scoped to db:create, db:delete and
# db:mint-token, and answers 403 on the list call the reset starts with. The
# procedure and the ordering constraint behind it are in docs/guides/database.md.
[tasks."reset"]
description = "Delete the local database files (backend/databases/)"
raw = true
run = "scripts/reset-databases.sh --local"

[tasks."reset:cloud"]
description = "Destroy and recreate every Turso database and the Fly volume"
raw = true
run = "scripts/reset-databases.sh --cloud"
